services:
  - type: web
    name: lyra
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm drizzle-kit migrate && pnpm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TENANT_SECRETS_KEY
        generateValue: true
      - key: LOCAL_AUTH_BOOTSTRAP_CODE
        generateValue: true
      - key: OWNER_OPEN_ID
        value: owner-local
      - key: OWNER_NAME
        value: Administrador Lyra
      - key: OWNER_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EVOLUTION_API_URL
        value: https://lyra-evolution-api.onrender.com
      - key: EVOLUTION_API_KEY
        sync: false
      - key: PLATFORM_PROFIT_MARGIN_PERCENT
        value: "30"
  - type: web
    name: lyra-evolution-api
    runtime: image
    plan: free
    image:
      url: evoapicloud/evolution-api:latest
    healthCheckPath: /
    envVars:
      - key: SERVER_TYPE
        value: http
      - key: SERVER_PORT
        value: "8080"
      - key: PORT
        value: "8080"
      - key: HOST
        value: "0.0.0.0"
      - key: SERVER_URL
        sync: false
      - key: AUTHENTICATION_API_KEY
        generateValue: true
      - key: AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES
        value: "false"
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: DATABASE_CONNECTION_CLIENT_NAME
        value: lyra-evolution-api
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "true"
      - key: DATABASE_SAVE_MESSAGE_UPDATE
        value: "true"
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "true"
      - key: DATABASE_SAVE_DATA_CHATS
        value: "true"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: DEL_INSTANCE
        value: "false"
      - key: QRCODE_LIMIT
        value: "30"
      - key: LOG_LEVEL
        value: "INFO"
